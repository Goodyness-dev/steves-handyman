<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d21"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  
  <!-- Steve's Handyman Modern "S" Mark with Precision Cut -->
  <path d="M42 20.5 C42 16.5 38 14 32 14 C25 14 20 17.5 20 23 C20 32 44 28 44 39 C44 45.5 39 50 32 50 C24 50 19 45.5 19 40" 
        fill="none" 
        stroke="url(#metal)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Precision Center Level Indicator Point -->
  <circle cx="32" cy="32" r="2.5" fill="#10b981"/>
</svg>
